<script>/* Relict Swarm platform adapter. Self-contained: safe on GitHub Pages,
 * Yandex and CrazyGames each initialize only in their own distinct builds.
 * GitHub Pages needs no external gaming SDK. */
(function(){
 'use strict';
 const provider=['yandex','crazygames'].includes(window.RELICT_PLATFORM)?window.RELICT_PLATFORM:'web';
 let sdk=null,readyForPlayers=false,sdkPaused=false,gameplayRequested=false,gameplayActive=false;
 let pauseHandler=()=>{},resumeHandler=()=>{};
 let language='ru',crazyLoadingStarted=false;
 function syncGameplay(playing){
  gameplayRequested=!!playing;
  // CrazyGames tracks focus and visibility itself. Do not send stop for tab blur.
  const active=gameplayRequested&&!sdkPaused&&(provider==='crazygames'||!document.hidden);
  if(!sdk)return;
  if(active===gameplayActive)return;
  gameplayActive=active;
  try{
   if(provider==='yandex'){
    if(active)sdk.features?.GameplayAPI?.start?.();
    else sdk.features?.GameplayAPI?.stop?.();
   }else if(provider==='crazygames'){
    if(active)sdk.game?.gameplayStart?.();
    else sdk.game?.gameplayStop?.();
   }
  }catch(e){console.warn('[Platform] gameplay event',e);}
 }
 function platformPause(){
  if(sdkPaused)return;
  sdkPaused=true;
  syncGameplay(gameplayRequested);
  pauseHandler();
 }
 function platformResume(){
  if(!sdkPaused)return;
  sdkPaused=false;
  resumeHandler();
  syncGameplay(gameplayRequested);
 }
 function markReady(){
  readyForPlayers=true;
  if(!sdk)return;
  try{
   if(provider==='yandex')sdk.features?.LoadingAPI?.ready?.();
   else if(provider==='crazygames'&&crazyLoadingStarted){sdk.game?.loadingStop?.();crazyLoadingStarted=false;}
  }catch(e){console.warn('[Platform] Game Ready',e)}
 }
 const api={
  provider,
  get language(){return language},
  get sdkAvailable(){return !!sdk},
  isPaused:()=>sdkPaused,
  ready:markReady,
  syncGameplay,
  attachGameHandlers({pause,resume}={}){
   if(typeof pause==='function')pauseHandler=pause;
   if(typeof resume==='function')resumeHandler=resume;
   if(sdkPaused)pauseHandler();
  }
 };
 window.RelicPlatform=api;
 document.addEventListener('visibilitychange',()=>{
  if(provider==='yandex')syncGameplay(gameplayRequested);
 });
 if(provider==='crazygames'){
  const crazy=window.CrazyGames?.SDK;
  if(!crazy||typeof crazy.init!=='function'){
   console.warn('[Platform] CrazyGames SDK v3 missing; use the CrazyGames build in its preview.');
   return;
  }
  if(crazy.environment==='disabled'){
   console.warn('[Platform] CrazyGames SDK disabled on this host.');
   return;
  }
  Promise.resolve().then(()=>crazy.init()).then(()=>{
   // The CrazyGames SDK only runs in local/portal environments.
   if(crazy.environment==='disabled')return;
   sdk=crazy;
   language=String(sdk.user?.systemInfo?.locale||'en');
   window.RelicOnPlatformLocale?.(language);
   try{sdk.game?.loadingStart?.();crazyLoadingStarted=true;}
   catch(e){console.warn('[Platform] loadingStart',e)}
   if(readyForPlayers)markReady();
   syncGameplay(gameplayRequested);
  }).catch(e=>console.warn('[Platform] CrazyGames SDK initialization failed',e));
  return;
 }
 if(provider!=='yandex')return;
 if(!window.YaGames || typeof window.YaGames.init!=='function'){
  console.warn('[Platform] Yandex SDK missing. Launch this build inside Yandex Games.');
  return;
 }
 Promise.resolve().then(()=>window.YaGames.init()).then(instance=>{
  sdk=instance;
  language=instance.environment?.i18n?.lang||'ru';window.RelicOnPlatformLocale?.(language);
  // ru is currently the only translated locale. Keep it as the UI fallback.
  try{instance.on?.('game_api_pause',platformPause);
      instance.on?.('game_api_resume',platformResume)}catch(e){console.warn('[Platform] SDK events',e)}
  if(readyForPlayers)markReady();
  syncGameplay(gameplayRequested);
 }).catch(e=>console.warn('[Platform] Yandex SDK initialization failed',e));
})();
</script>
<script>


'use strict';
(()=>{
const $=id=>document.getElementById(id),C=$('world');
// Mutable only while rendering a static skin preview into a private offscreen canvas.
let cx=C.getContext('2d',{alpha:false});
const RED='#ff667e',TEAL='#50f2db',AMBER='#ffc174',PURPLE='#b988ff',BLUE='#6dbbff';

/**
 * Pure boss/nearby-threat decision. No DOM, canvas, game state or audio access.
 * This file is an actual ES module for Node tests; the standalone HTML builder
 * inlines its exported function inside the legacy game closure.
 */
function selectCombatTarget(nearest, bosses, x, y, max = 550, weapon = 'pulse', trainingMode = false) {
  if (!nearest || trainingMode || weapon === 'flame') return nearest;
  let boss = null, best = Infinity;
  for (const e of bosses) {
    if (e.hp <= 0) continue;
    const dist = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (dist < best && dist < Math.min(max, 550) ** 2) {
      boss = e;
      best = dist;
    }
  }
  if (!boss) return nearest;
  const dangerRadius = 112;
  if (!nearest.elite && (nearest.x - x) ** 2 + (nearest.y - y) ** 2 < dangerRadius * dangerRadius) return nearest;
  return boss;
}

/**
 * Pure fusion eligibility rule: no UI, storage, random numbers or game globals.
 * Tested as an ES module; bundled inline to keep the HTML game self-contained.
 */
function eligibleFusionIds(state, recipes) {
  if (state.fusionCores < 1 || state.hybrids.length >= 3) return [];
  return Object.entries(recipes)
    .filter(([id, h]) =>
      !state.hybrids.some(z => z.id === id) &&
      [h.a, h.b].every(k => state.drones.some(d => d.id === k)))
    .map(([id]) => id);
}

// Boss hit/shield/DPS caps. Takes a snapshot and returns next counters without mutation.
function calculateBossDamage(enemy, raw, time, threat) {
 const balanceId=enemy.bossBalanceId||enemy.id;
 const maxHit=balanceId==='omega'?340:balanceId==='synth3'?230:enemy.id==='synth2'?190:enemy.id==='synth1'?260:enemy.id==='boss2'?255:285;
 const afterHitCap=Math.min(raw,maxHit);
 const afterShield=enemy.shield>0?afterHitCap*.27:afterHitCap;
 const restart=!enemy.damageSecondAt||time-enemy.damageSecondAt>=1;
 const damageSecondAt=restart?time:enemy.damageSecondAt;
 const spent=restart?0:(enemy.damageSecond||0);
 const ceiling=(enemy.id==='omega'?1400:enemy.id==='synth3'?1050:enemy.id==='synth2'?900:enemy.id==='synth1'?850:enemy.id==='boss2'?950:1030)*(1+Math.max(0,(threat||1)-1)*.17);
 const damage=Math.min(afterShield,Math.max(0,ceiling-spent));
 return {
  damage,damageSecondAt,damageSecond:spent+damage,
  blockedByHitCap:Math.max(0,raw-afterHitCap),
  blockedByShield:Math.max(0,afterHitCap-afterShield),
  blockedByDpsCap:Math.max(0,afterShield-damage),
  blockedTotal:Math.max(0,raw-damage)
 };
}

// Pure weapon damage multiplier, shared by standard and fusion weapons.
function calculateWeaponDamage(playerDamage, rank, powerLevels, rageActive) {
 return playerDamage*(1+Math.sqrt(rank-1)*.14)*(1+powerLevels*.20)*(rageActive?2.1:1);
}

// Weapon fire pacing; the minimum interval and excess-fire multiplier are deliberate.
function calculateWeaponCooldown(base, haste, rateLevels, rank) {
 const cooldownBonus=1+Math.log1p(rateLevels)*.40;
 const rawCooldown=base/(haste*cooldownBonus*(1+Math.log1p(rank-1)*.16));
 return {
  cooldown:Math.max(.19,rawCooldown),
  attackOverflow:Math.max(1,.19/Math.max(.0001,rawCooldown))
 };
}

// Fusion must preserve progression paid for by BOTH consumed weapons.
// Matched modifiers keep their full points, unmatched branches are converted
// into universal power / attack tempo instead of vanishing.
function createFusionWeapon(id, a, b, branches) {
 const keys=branches.map(([key])=>key);
 const mods=Object.fromEntries(keys.map(key=>[key,Math.max(0,(a.mods?.[key]||0)+(b.mods?.[key]||0))]));
 const sourcePoints=[a,b].reduce((n,d)=>n+Object.values(d.mods||{}).reduce((s,v)=>s+Math.max(0,v||0),0),0);
 const retained=Object.values(mods).reduce((s,v)=>s+v,0);
 const extra=Math.max(0,sourcePoints-retained);
 const power=keys.includes('power')?'power':keys[0];
 const tempo=keys.includes('rate')?'rate':power;
 if(power===tempo)mods[power]=(mods[power]||0)+extra;
 else{
  mods[power]=(mods[power]||0)+Math.ceil(extra*.65);
  mods[tempo]=(mods[tempo]||0)+Math.floor(extra*.35);
 }
 // The two paid weapon levels now survive the merge.
 const lvl=Math.max(1,Math.floor(a.lvl||1)+Math.floor(b.lvl||1)-1);
 return {id:'fusion_'+id,lvl,mods,cd:.2,hitCd:0};
}

 if(id==='saw'||id==='fusion_thermal'||id==='fusion_tesla'||id==='fusion_frostblade'||id==='fusion_magnetblade')return;
 const m={pulse:'laser',arc:'arc',rail:'rail',rocket:'rocket',plasma:'plasma',cryo:'cryo',flame:'flame',gravity:'gravity',mine:'mine',boomer:'boomer'};
 if(m[id]){if(id==='arc')return;if(id==='cryo')cryoAudibleUntil=performance.now()/1000+1.25;if(id!=='cryo')sfx(m[id],.90);return;}
 if(!id.startsWith('fusion_'))return;
 const recipe=HYBRIDS[id.slice(7)];if(!recipe)return;
 const sounds=[m[recipe.a],m[recipe.b]].filter(Boolean);
 // Layer only one primary shot, with quieter secondary modulation; loops follow living game objects.
 const primary=sounds.includes('rail')?'rail':sounds.includes('rocket')?'rocket':sounds.includes('laser')?'laser':sounds[0];
 if(primary&&primary!=='flame'&&primary!=='cryo')sfx(primary,.86);
 if(sounds.includes('cryo'))cryoAudibleUntil=performance.now()/1000+1.25;
 if(sounds.includes('arc')&&primary!=='arc')sfx('arc',.21);
 if(sounds.includes('plasma')&&primary!=='plasma')sfx('plasma',.20);
 if(sounds.includes('gravity')&&primary!=='gravity')sfx('gravity',.20);
}

// A preview is a real screenshot of the same Canvas robot renderer used in combat.
// The old hand-drawn SVG is a fallback for non-Canvas/test environments only.
const SKIN_PREVIEW_CACHE=new Map();
function skinSvg(id){
 const key=SKINS[id]?id:'relict';
 const skin=SKINS[key];
 if(typeof document==='undefined'||typeof cx==='undefined'||!document.createElement)return skinSvgFallback(key);
 let png=SKIN_PREVIEW_CACHE.get(key);
 if(!png){
  const canvas=document.createElement('canvas');
  canvas.width=320;canvas.height=360; // 2x the 160x180 logical preview
  const previewCtx=canvas.getContext('2d',{alpha:true});
  if(!previewCtx)return skinSvgFallback(key);
  const liveCtx=cx,liveOverride=skinVisualOverride;
  try{
   cx=previewCtx;skinVisualOverride=skin;
   previewCtx.setTransform(2,0,0,2,0,0);
   previewCtx.translate(80,90);
   previewCtx.scale(1.65,1.65);
   drawRobot({x:0,y:0,dx:0,dy:-1,inv:0},true);
   png=canvas.toDataURL('image/png');
   SKIN_PREVIEW_CACHE.set(key,png);
  }catch(error){
   console.error('[Relict Swarm] Skin preview render failed:',key,error);
  }finally{
   cx=liveCtx;skinVisualOverride=liveOverride;
  }
 }
 return png?'<img class="skin-art skin-canvas-preview" src="'+png+'" width="160" height="180" alt="'+skin.name+'">':skinSvgFallback(key);
}

function rarityRoll(){
 // Keep the original 60/27/10/3 distribution when no research has been purchased.
 const research=metaBonus('rarity');
 const weights=RARITIES.map(r=>r.chance+(r.id==='common'?-.6:r.id==='uncommon'?.3:r.id==='rare'?.2:.1)*research);
 let k=rand(0,weights.reduce((a,v)=>a+v,0));
 for(let i=0;i<RARITIES.length;i++){k-=weights[i];if(k<=0)return RARITIES[i]}
 return RARITIES[0];
}

  if(!d){if(BASE_WEAPONS.includes(id)&&S.drones.length<MAX_WEAPONS)pool.push({kind:'new',id,weight:4.5});}
  else {const rarity=rarityRoll(),keys=weaponBranches(id).map(b=>b[0]).sort(()=>Math.random()-.5).slice(0,rarity.steps);pool.push({kind:'weapon',id,rarity,keys,weight:7.2});}
 }
 // v0.10.10: support modules should be a meaningful option, not an ~5% lottery.
  // A repair pack appears only when at least 24 hull points are missing.
  for(const id of ['damage','speed','hp','cooldown','magnet','heal']){
    if(id==='heal' && S.player.hp>S.player.maxHp-24)continue;
    pool.push({kind:'stat',id,weight:2.2});
  }
 // Rerolled offers must not contain any card from the previous set.
 const available=pool.filter(u=>!excludedIds.has(u.kind+':'+u.id));
 const out=[];
 while(out.length<3&&available.length){let sum=available.reduce((a,o)=>a+o.weight,0),r=rand(0,sum),chosen=available[available.length-1];for(const o of available){r-=o.weight;if(r<=0){chosen=o;break}}
  out.push(chosen);available.splice(available.indexOf(chosen),1);
 }
 return out;
}

function droneUpdate(dt){
 const haste=(S.haste||1)*(S.rageTimer>0?1.45:1)*(S.tacticHasteUntil>S.t?1.25:1);
 for(let i=0;i<S.drones.length;i++){

  const pos=getDronePos(d,i),linked=S.hybrids.some(h=>HYBRIDS[h.id].a===d.id||HYBRIDS[h.id].b===d.id);
  d.cd-=dt;d.hitCd-=dt*(S.rageTimer>0?1.45:1);d.flash=Math.max(0,(d.flash||0)-dt);
  const baseDmg=calculateWeaponDamage(S.playerDmg,rank,wm(d,'power'),S.rageTimer>0);
  if(['saw','fusion_thermal','fusion_tesla','fusion_frostblade','fusion_magnetblade'].includes(d.id)){
   const positions=sawPositions(d,i),thermal=d.id==='fusion_thermal',tesla=d.id==='fusion_tesla',frost=d.id==='fusion_frostblade',magnet=d.id==='fusion_magnetblade';
   if(tesla){d.zapCd=(d.zapCd||0)-dt*(S.rageTimer>0?1.45:1);if(d.zapCd<=0){const near=closest(S.player.x,S.player.y,365);if(near){scheduleChain(pos,near,3+Math.min(12,wm(d,'jumps')),22*baseDmg,260,'#ffe5a6',.22);d.zapCd=.95/(S.haste||1)}}}
   if(magnet&&!(S.timeStopTimer>0)){for(const pp of positions)for(const e of S.enemy){if(e.hp<=0||e.elite)continue;const dx=pp.x-e.x,dy=pp.y-e.y,dd=Math.hypot(dx,dy);if(dd>30&&dd<130+wm(d,'radius')*8){let pull=(90+wm(d,'force')*28)*dt;e.x+=dx/dd*pull;e.y+=dy/dd*pull;}}}
   const speedBoost=1+Math.log1p(wm(d,'spin'))*.25,overflow=1+Math.max(0,wm(d,'count')-9)*.14+Math.max(0,wm(d,'radius')-13)*.08;
   if(d.hitCd<=0){let found=0;
    for(const pp of positions){for(const e of S.enemy){

       if(e.hp<=0)continue;
       hurtEnemy(e,(16+Math.sqrt(rank)*4)*baseDmg*speedBoost*overflow*(magnet?1.18:1),{knock:rank>=7?8:4,burn:thermal?1.3:0,stun:tesla?.08:frost?.35:0,slow:frost?2:0});if(frost&&e.hp>0){e.frost=Math.max(e.frost||0,1.8);applyChill(e,15)}found++;

    if(tesla&&found){const near=closest(pos.x,pos.y,280);if(near)scheduleChain(pos,near,2+Math.min(8,wm(d,'jumps')),22*baseDmg,235,'#ffe9a1',.20)}
    if(found){sfx('sawHit',.8);d.hitCd=Math.max(.13,(.36-Math.min(rank,12)*.007)/(speedBoost*(S.haste||1)));if(Math.random()<.15)burst(pos.x,pos.y,thermal?'#ff8a45':AMBER,3,65);}

   if(frost){d.frostWakeTimer=(d.frostWakeTimer||0)-dt;if(d.frostWakeTimer<=0){

   // A fusion consumes two modules; orbital builds must not lose the

// Boss behaviours: readable threats with different positioning decisions.

function bossEncounterRatio(e){if(!e?.bossBalanceId||e.bossBalanceId===e.id)return 1;return (ENEMY[e.bossBalanceId]?.dmg||ENEMY[e.id]?.dmg||1)/Math.max(1,ENEMY[e.id]?.dmg||1)}
function bossHazard(data){
 if(S.hazards.length>=48)return;
 S.hazards.push({...data,dmg:data.dmg*bossEncounterRatio(data.owner),life:data.delay,hit:false});
}
function bossBullet(e,angle,speed,damage,color,r=7,life=4.2){

 S.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r,dmg:damage*bossEncounterRatio(e),col:color,life});

function bossReinforcements(e,id,count,limit=9){

 const n=Math.max(0,Math.min(count,limit-nearby,148-S.enemy.length));
 for(let k=0;k<n;k++){
  const a=(k+.5)*TAU/Math.max(1,n)+S.t*.15;
  const spawned=spawnEnemy(id,a,Math.max(220,Math.hypot(e.x-S.player.x,e.y-S.player.y)));
  if(spawned){spawned.x=clamp(e.x+Math.cos(a)*(e.r+92),-1740,1740);spawned.y=clamp(e.y+Math.sin(a)*(e.r+92),-1740,1740);spawned.summoned=true;}
 }

function pointSegmentDist(px,py,x0,y0,x1,y1){let dx=x1-x0,dy=y1-y0,t=clamp(((px-x0)*dx+(py-y0)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-(x0+dx*t),py-(y0+dy*t))}
function updateHazards(dt){
 for(const h of S.hazards){
  h.delay-=dt;h.life-=dt;
  if(h.owner&&h.owner.hp<=0){h.hit=true;h.life=-1;continue;}
  // The telegraphed sweep visibly rotates before the actual strike.
  if(h.type==='sweep'&&h.delay>0)h.ang+=(h.turnSpeed||0)*dt;
  if(h.type==='forgeScorch'){
   // Residual hot ground is hazardous briefly, then disappears.
   h.scorchTick=(h.scorchTick??.4)-dt;
   if(h.life>0&&h.scorchTick<=0){
    h.scorchTick=.45;
    if(Math.hypot(S.player.x-h.x,S.player.y-h.y)<h.r+S.player.rad)
     hitPlayer(Math.max(7,h.dmg*.33),h.x,h.y);
   }
   continue;
  }
  if(h.delay>0||h.hit)continue;
  h.hit=true;
  if(h.type==='slash'||h.type==='dash'||h.type==='sweep'){
   const x1=h.x+Math.cos(h.ang)*h.len,y1=h.y+Math.sin(h.ang)*h.len;
   if(pointSegmentDist(S.player.x,S.player.y,h.x,h.y,x1,y1)<h.r+S.player.rad)hitPlayer(h.dmg,h.x,h.y);
   S.fx.push({type:'beam',a:{x:h.x,y:h.y},b:{x:x1,y:y1},life:.26,max:.26,col:h.col,width:h.type==='dash'?15:12});
   if(h.type==='dash'&&h.owner&&h.owner.hp>0){
    // The Reaper now really moves along the warned path; no invisible teleport.

// v0.10.12: diagnostics never touch enemy spawn, damage, or frame simulation.
// JS timings include only CPU work. Canvas rendering may take additional GPU/browser time.
const perf={on:true,lastRaf:0,bucketFrom:0,frames:0,intervals:[],updateMs:[],drawMs:[],audioMs:[],samples:[],startedAt:Date.now(),excludedLargeGaps:0};
function perfReset(){perf.lastRaf=0;perf.bucketFrom=0;perf.frames=0;perf.intervals=[];perf.updateMs=[];perf.drawMs=[];perf.audioMs=[];perf.samples=[];perf.startedAt=Date.now();perf.excludedLargeGaps=0;resetRenderAdaptation();perfShow();}
function perfShow(){} // Performance sampling is invisible.
function perfSnapshot(){
 if(!S)return {enemies:0,enemyBullets:0,shots:0,fx:0,parts:0,pickups:0,hazards:0,mines:0,chains:0};
 return {enemies:S.enemy?.length||0,enemyBullets:S.enemyBullets?.length||0,shots:S.bullets?.length||0,fx:(S.fx?.length||0)+(S.effects?.length||0)+(S.floaters?.length||0),parts:S.parts?.length||0,pickups:S.pickups?.length||0,hazards:(S.hazards?.length||0)+(S.gravityWells?.length||0),mines:S.mines?.length||0,chains:S.chains?.length||0};
}
function perfAvg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function perfPercentile(a,p){if(!a.length)return 0;const v=a.slice().sort((x,y)=>x-y);return v[Math.min(v.length-1,Math.ceil(v.length*p)-1)]}
function perfTick(now,msUpdate,msDraw,msAudio){
 if(!perf.on||mode!=='playing'||document.hidden){perf.lastRaf=0;perf.bucketFrom=0;return;}
 if(!perf.bucketFrom)perf.bucketFrom=now;
 if(perf.lastRaf){const dt=now-perf.lastRaf;if(dt>0&&dt<1500)perf.intervals.push(dt);else perf.excludedLargeGaps++;}
 perf.lastRaf=now;perf.frames++;
 perf.updateMs.push(msUpdate);perf.drawMs.push(msDraw);perf.audioMs.push(msAudio);
 if(now-perf.bucketFrom<1000)return;

 const intervals=perf.intervals;
 const counts=perfSnapshot();
 const sample={elapsedGameSec:Math.round((S?.t||0)*10)/10,wallClock:Date.now(),renderQuality,renderDpr:+scale.toFixed(2),canvasPixels:C.width*C.height,fps:+(perf.frames/elapsed).toFixed(1),frameP95ms:+perfPercentile(intervals,.95).toFixed(1),frameP99ms:+perfPercentile(intervals,.99).toFixed(1),slowFrames33:intervals.filter(v=>v>33.3).length,slowFrames50:intervals.filter(v=>v>50).length,cpuUpdateMs:+perfAvg(perf.updateMs).toFixed(2),cpuDrawMs:+perfAvg(perf.drawMs).toFixed(2),cpuAudioMs:+perfAvg(perf.audioMs).toFixed(2),...counts};

}
// Internal performance aggregates; never shown inside the game.
function perfSummary(){
 const samples=perf.samples||[];
 if(!samples.length)return null;
 const fps=samples.map(s=>s.fps).filter(Number.isFinite),p95=samples.map(s=>s.frameP95ms).filter(Number.isFinite);
 return {samples:samples.length,avgFps:+perfAvg(fps).toFixed(1),minFps:fps.length?Math.min(...fps):null,
  worstP95ms:p95.length?Math.max(...p95):null,
  slowFrames33:samples.reduce((v,s)=>v+(s.slowFrames33||0),0),
  avgUpdateMs:+perfAvg(samples.map(s=>s.cpuUpdateMs)).toFixed(2),
  avgDrawMs:+perfAvg(samples.map(s=>s.cpuDrawMs)).toFixed(2)};
}
function renderQualityControls(){
 return `<section class="graphics-settings"><div class="graphics-heading"><strong>GRAPHICS QUALITY</strong><span>4 PRESETS</span></div>
  <div class="graphics-presets" role="group" aria-label="Graphics quality">
   ${RENDER_PRESETS.map(p=>`<button type="button" data-graphics-preset="${p.id}" aria-pressed="${renderQuality===p.id}" class="graphics-preset ${renderQuality===p.id?'selected':''}"><b>${p.name}</b><small>${p.desc}</small></button>`).join('')}
  </div>

}
document.addEventListener('click',e=>{

addEventListener('visibilitychange',()=>{perf.lastRaf=0;perf.bucketFrom=0;});
let lastRuntimeError='',lastRuntimeErrorAt=0;
function loop(now){
 requestAnimationFrame(loop); // Schedule next frame *before* updating; an exception must not silently freeze the browser game.
 try{
  let dt=Math.min(.039,Math.max(0,(now-last)/1000||.016));last=now;ambient+=dt;frame++;
   const gameplayRunning=mode==='playing'&&!window.RelicPlatform?.isPaused(),perfPlaying=perf.on&&gameplayRunning,cpuStart=perfPlaying?performance.now():0;
   if(gameplayRunning)update(dt);
   const afterUpdate=perfPlaying?performance.now():0;

   const afterDraw=perfPlaying?performance.now():0;
   updateSoundtrack();
   if(perfPlaying&&mode==='playing')perfTick(now,afterUpdate-cpuStart,afterDraw-afterUpdate,performance.now()-afterDraw);

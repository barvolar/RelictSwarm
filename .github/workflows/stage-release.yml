name: Stage verified standalone HTML release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete game and telemetry
        run: npm test
      - name: Stage compiled GitHub Pages entry
        run: |
          cp dist/index.html index.html
          cmp dist/index.html index.html
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: stage verified game HTML for publication"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

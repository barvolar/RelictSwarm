name: Stage verified standalone HTML release

on:
  push:
    branches:
      - release/2026-10-30
    paths:
      - .github/workflows/stage-release.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the complete modular game
        run: npm test
      - name: Verify the tested, unchanged HTML build
        run: npm run verify:refactor
      - name: Put compiled HTML in the GitHub Pages root
        run: |
          cp dist/index.html index.html
          cmp dist/index.html index.html
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: stage verified RelictSwarm HTML for main"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: Browser skin regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  real-canvas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game
        run: npm test
      - name: Real Chromium Canvas check of all 32 skins
        run: node scripts/browser-skins.mjs

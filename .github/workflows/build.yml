name: Build and verify modular game

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, syntax-check and test gameplay rules
        run: npm test
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: RelictSwarm-test-build
          path: dist/
          if-no-files-found: error

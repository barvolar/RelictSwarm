name: Build and verify modular game

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, syntax-check and test gameplay rules
        run: npm test
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: RelictSwarm-test-build
          path: dist/
          if-no-files-found: error

      - name: Pack Yandex Games test ZIP
        run: |
          cd dist/yandex
          zip -q -r ../../RelictSwarm-Yandex-test.zip .
      - name: Upload Yandex Games package
        uses: actions/upload-artifact@v4
        with:
          name: RelictSwarm-Yandex-test
          path: RelictSwarm-Yandex-test.zip
          if-no-files-found: error

      - name: Pack CrazyGames Basic Launch ZIP
        run: |
          cd dist/crazygames
          zip -q -r ../../RelictSwarm-CrazyGames-test.zip .
      - name: Upload CrazyGames test package
        uses: actions/upload-artifact@v4
        with:
          name: RelictSwarm-CrazyGames-test
          path: RelictSwarm-CrazyGames-test.zip
          if-no-files-found: error
